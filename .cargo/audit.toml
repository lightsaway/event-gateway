[advisories]
# Retained in Cargo.lock by transitive SQLx package metadata, but not reachable
# in any enabled target or feature graph. The advisory has no fixed release.
#
# RUSTSEC-2026-0459: libsqlite3-sys appears only as transitive SQLx package
# metadata (no SQLite driver feature is enabled); no fix is reachable.
#
# RUSTSEC-2026-0387: crypto-bigint 0.5.x is pulled in by jwks -> jsonwebtoken
# -> p256/p384. We only verify signatures against public keys, so no secret
# integers are processed; the fix needs an upstream RustCrypto bump.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0459", "RUSTSEC-2026-0387"]
